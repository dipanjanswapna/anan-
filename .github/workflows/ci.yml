name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://anan:anan_local_dev@localhost:5432/anan_dev?schema=public
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: anan_dev
          POSTGRES_USER: anan
          POSTGRES_PASSWORD: anan_local_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anan -d anan_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install --global pnpm@10.0.0
      - name: Validate workspace manifest
        run: node -e "const p=require('./package.json'); if(!p.private) process.exit(1); console.log('ANAN workspace manifest OK')"
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Validate Prisma schema
        run: pnpm --filter @anan/api prisma:validate
      - name: Generate Prisma Client
        run: pnpm --filter @anan/api prisma:generate
      - name: Replay Prisma migrations on empty PostgreSQL
        run: pnpm --filter @anan/api exec prisma migrate deploy
      - name: Verify migration status
        run: pnpm --filter @anan/api exec prisma migrate status
      - name: Build API
        run: pnpm --filter @anan/api build
      - name: Typecheck storefront
        run: pnpm --filter @anan/web typecheck
      - name: Build storefront
        run: pnpm --filter @anan/web build
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
      - name: Build development container image
        run: docker build -f Dockerfile.dev -t anan-dev:ci .
