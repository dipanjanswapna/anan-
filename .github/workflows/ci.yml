name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://anan:anan_local_dev@localhost:5432/anan_dev?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install --global pnpm@10.0.0
      - name: Validate workspace manifest
        run: node -e "const p=require('./package.json'); if(!p.private) process.exit(1); console.log('ANAN workspace manifest OK')"
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Validate Prisma schema
        run: pnpm --filter @anan/api prisma:validate
      - name: Generate Prisma Client
        run: pnpm --filter @anan/api prisma:generate
      - name: Build API
        run: pnpm --filter @anan/api build
      - name: Typecheck storefront
        run: pnpm --filter @anan/web typecheck
      - name: Build storefront
        run: pnpm --filter @anan/web build
