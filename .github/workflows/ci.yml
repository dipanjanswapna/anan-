name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install --global pnpm@10.0.0
      - name: Validate workspace manifest
        run: node -e "const p=require('./package.json'); if(!p.private) process.exit(1); console.log('ANAN workspace manifest OK')"
      - name: Validate pnpm workspace
        run: pnpm install --no-frozen-lockfile
