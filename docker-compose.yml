services:
  postgres:
    image: postgres:16-alpine
    container_name: anan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: anan_dev
      POSTGRES_USER: anan
      POSTGRES_PASSWORD: anan_local_dev
    ports:
      - "5432:5432"
    volumes:
      - anan_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anan -d anan_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: anan-api
    restart: unless-stopped
    command: ["sh", "-c", "pnpm --filter @anan/api exec prisma db push && pnpm --filter @anan/api prisma:seed && pnpm --filter @anan/api start:dev"]
    environment:
      NODE_ENV: development
      PORT: 4000
      CORS_ORIGINS: http://localhost:3000
      DATABASE_URL: postgresql://anan:anan_local_dev@postgres:5432/anan_dev?schema=public
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: anan-web
    restart: unless-stopped
    command: ["pnpm", "--filter", "@anan/web", "dev", "--hostname", "0.0.0.0"]
    environment:
      NODE_ENV: development
      ANAN_API_URL: http://api:4000/api/v1
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

volumes:
  anan_postgres_data:
