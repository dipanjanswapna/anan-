services:
  postgres:
    image: postgres:16-alpine
    container_name: anan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: anan_dev
      POSTGRES_USER: anan
      POSTGRES_PASSWORD: anan_local_dev
    ports:
      - "5432:5432"
    volumes:
      - anan_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anan -d anan_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  anan_postgres_data:
